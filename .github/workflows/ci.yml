name: CI

# docs/Architecture.md Deployment "Build & release pipeline" — PR·push 시 lint → typecheck → test → build.
# DoD Gate의 "Lint passes / Build succeeds / Tests pass" 출력이 여기서 나온다.
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (apps/web)
        run: npm run build

      - name: Build (apps/extension)
        run: npm run build:ext
