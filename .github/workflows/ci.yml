name: CI

# docs/Architecture.md Deployment "Build & release pipeline" — PR·push 시 lint → typecheck → test → build.
# DoD Gate의 "Lint passes / Build succeeds / Tests pass" 출력이 여기서 나온다.
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (apps/web)
        run: npm run build

      - name: Build (apps/extension)
        # apps/extension/vite.background.config.ts의 copyManifest()는 VITE_APP_ORIGIN이
        # 비어 있으면 빌드를 throw로 실패시킨다(M-5, 조용히 깨지는 확장 패키징 방지).
        # CI는 실제 배포 origin이 아니라 빌드 성공 여부·manifest 구조만 검증하면 되므로,
        # 보안상 민감하지 않은 플레이스홀더 origin을 빌드 시점에만 주입한다.
        run: npm run build:ext
        env:
          VITE_APP_ORIGIN: https://example.invalid
